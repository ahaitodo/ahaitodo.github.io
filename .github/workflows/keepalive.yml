name: Keep weeny awake
on:
  schedule:
    # Every 25 minutes. GitHub cron is UTC; delayed runs are normal on busy days.
    - cron: '*/25 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping weeny apps /health
        run: |
          set -uo pipefail
          URLS=(
            "https://h-d00s.onweeny.com/health"
            "https://ahai-3qd7.onweeny.com/health"
          )
          ok=0
          for URL in "${URLS[@]}"; do
            for i in 1 2 3; do
              echo "ping $i: $URL"
              if curl -fsS --max-time 25 "$URL"; then
                echo "keep-alive OK: $URL"
                ok=$((ok+1))
                break
              fi
              sleep 10
            done
          done
          echo "healthy endpoints: $ok/${#URLS[@]}"
          # The goal is to wake the shared server: one successful request is enough.
          # Only fail when every endpoint is unreachable.
          if [ "$ok" -eq 0 ]; then
            echo "keep-alive failed for all endpoints"
            exit 1
          fi
